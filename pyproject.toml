[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smallmlp"
version = "0.1.0"
description = "Non-parametric MLP for small tabular data: weighted soft-median with data-dependent prediction zones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Emelyanov Ilya" }
]
keywords = ["machine-learning", "small-data", "tabular", "non-parametric", "uncertainty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
bench = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/nsdmlk/SmallMLP"
Repository = "https://github.com/nsdmlk/SmallMLP"
Issues = "https://github.com/nsdmlk/SmallMLP/issues"

[tool.setuptools.packages.find]
include = ["smallmlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"